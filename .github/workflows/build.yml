name: Build and test

on:
  push:
    branches: [main, codex/development]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run server GameTests
        run: ./gradlew --no-daemon build runGametest
      - name: Verify distributable JAR
        run: |
          python3 scripts/verify_mod_jar.py
          python3 scripts/verify_proxy_jar.py
      - name: Verify reset supervisor and Compose generation
        run: |
          python3 docker/test_runtime.py
          python3 docker/test_compose.py
          sh -n docker/entrypoint.sh
      - uses: actions/upload-artifact@v4
        with:
          name: death-swap-mc26.2
          path: |
            build/libs/death-swap-*.jar
            velocity-plugin/build/libs/death-swap-proxy-*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-results
          path: build/gametest-results.xml
          if-no-files-found: ignore
